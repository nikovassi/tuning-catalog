<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%VITE_SITE_NAME% — Тунинг продукти и аксесоари</title>
    <meta name="description" content="Каталог с тунинг продукти и аксесоари за автомобили — осветление, окачване, изпускателни системи, интериор, екстериор и силов тунинг." />
    <meta name="theme-color" content="#f6f6f4" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bg_BG" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Тема преди първо рисуване — без „проблясване“.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Сайтът изисква JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
